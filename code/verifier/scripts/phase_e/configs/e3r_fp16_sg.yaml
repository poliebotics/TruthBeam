# E3r-fp16-sg: FPN architecture, single-GPU bs=4 fp16+GradScaler
# Companion to E1-fp16-sg. Tests whether FPN+fp16 converges similarly to U-Net+fp16
# (which succeeded at ep 10), and to E3r-bf16 (which succeeded at ep 15 with delayed onset).
experiment_id: phase_e_e3r_fp16_sg
out_dir: /path/to/poliebotics_phase_b/experiments/phase_e/e3r_fp16_sg
seed: 13

data:
  d2_dir: /path/to/poliebotics_phase_b/poliebotics_phase_b/data/d2
  v10_dir: /path/to/poliebotics_phase_b/poliebotics_phase_b/data/v10
  d2_train_start: 0
  d2_train_end: 4194
  d2_val_start: 5394
  d2_val_end: 5992
  capture_h: 1150
  capture_w: 1330
  emission_h: 1080
  emission_w: 1920

model:
  arch: EmissionPredictorV2
  pretrained: true
  fpn_out_channels: 256

train:
  batch_size: 4              # single-GPU bs=4 (effective batch 4)
  val_batch_size: 4
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 200
  grad_clip: 1.0
  max_epochs: 30

stop:
  hard_cap_epochs: 30
