# E1-fp16-ddp: same as E1-bf16 EXCEPT precision = fp16+GradScaler
# DDP=2 per-GPU bs=2 effective batch 4. Triangulates bf16 vs fp16 vs DDP:
#   E1-bf16 (DDP=2, bf16):  ep 0-3 flat ~17 dB, jumped to 21+ at ep 4-5, success ep 10
#   E1-fp16-sg (single-GPU bs=4, fp16): smooth climb, ep 5 = 24.06 dB, success likely ep 10
#   E1-fp16-ddp (DDP=2, fp16, this run): isolates fp16's effect from DDP confound
experiment_id: phase_e_e1_fp16_ddp
out_dir: /path/to/poliebotics_phase_b/experiments/phase_e/e1_fp16_ddp
seed: 7

data:
  d2_dir: /path/to/poliebotics_phase_b/poliebotics_phase_b/data/d2
  v10_dir: /path/to/poliebotics_phase_b/poliebotics_phase_b/data/v10
  d2_train_start: 0
  d2_train_end: 4194
  d2_val_start: 5394
  d2_val_end: 5992
  capture_h: 1150
  capture_w: 1330
  emission_h: 1080
  emission_w: 1920

model:
  arch: EmissionPredictor
  pretrained: true

train:
  batch_size: 2              # per-GPU; effective 4 with DDP=2
  val_batch_size: 4
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 200
  grad_clip: 1.0
  max_epochs: 30

stop:
  hard_cap_epochs: 30
