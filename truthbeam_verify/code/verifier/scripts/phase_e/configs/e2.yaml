# E2: native-resolution emission training
# - Same as E1 EXCEPT capture at 2300×2660 (4× total pixels vs E1)
# - Tests whether higher input resolution preserves binding
# - Per-GPU bs=2, DDP=2 → effective batch 4 (V4 verified peak ≈ 31 GB at bs=2 + bf16)
experiment_id: phase_e_e2
out_dir: /path/to/poliebotics_phase_b/experiments/phase_e/e2
seed: 11

data:
  d2_dir: /path/to/poliebotics_phase_b/poliebotics_phase_b/data/d2
  v10_dir: /path/to/poliebotics_phase_b/poliebotics_phase_b/data/v10
  d2_train_start: 0
  d2_train_end: 4194
  d2_val_start: 5394
  d2_val_end: 5992
  capture_h: 2300
  capture_w: 2660
  emission_h: 1080
  emission_w: 1920

model:
  arch: EmissionPredictor
  pretrained: true

train:
  batch_size: 2                # per-GPU; effective 4 with DDP=2
  val_batch_size: 2            # smaller val batch at native res
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 200
  grad_clip: 1.0
  max_epochs: 30

stop:
  hard_cap_epochs: 30
